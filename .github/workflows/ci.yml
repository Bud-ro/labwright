name: ci

on:
  push:
  pull_request:

jobs:
  dart:
    name: dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # One workspace resolution, analyze the whole tree, then test each package.
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: test all packages
        shell: bash
        run: |
          for p in packages/* tests/labwright_example; do
            if [ -d "$p/test" ]; then
              echo "== $p =="
              ( cd "$p" && dart test ) || exit 1
            fi
          done
