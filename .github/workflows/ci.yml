name: ci

on:
  push:
  pull_request:

jobs:
  dart:
    name: dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`: `dart format` output changes across SDK releases,
      # so the format gate below is only reproducible when CI runs the SAME SDK
      # the repo was formatted with. When upgrading, bump this and run
      # ./format.sh in the same commit.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.3

      - run: dart pub get
      - name: check formatting
        shell: bash
        run: ./format.sh --check
      - run: dart analyze --fatal-infos
      - name: test all packages
        shell: bash
        run: |
          for p in packages/* example/e2e; do
            if [ -d "$p/test" ]; then
              echo "== $p =="
              ( cd "$p" && dart test -x corpus ) || exit 1
            fi
          done

  flutter:
    name: flutter apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: analyze + test apps
        shell: bash
        run: |
          for app in apps/*/; do
            if [ -f "$app/pubspec.yaml" ]; then
              echo "== $app =="
              ( cd "$app" && flutter pub get && flutter analyze && flutter test --exclude-tags corpus ) || exit 1
            fi
          done

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: dart pub get

      - uses: actions/cache@v4
        with:
          path: |
            packages/labwright_rsrc_parse/corpus/vi
            packages/labwright_seq/corpus/seq
          key: corpus-${{ hashFiles('packages/labwright_rsrc_parse/corpus/sources.json', 'packages/labwright_seq/corpus/seq-sources.json') }}

      - name: fetch the corpora
        run: |
          dart run packages/labwright_rsrc_parse/tool/fetch_corpus.dart
          dart run packages/labwright_seq/tool/fetch_seq_corpus.dart

      - name: corpus tests
        shell: bash
        run: |
          for p in packages/labwright_rsrc_parse packages/labwright_seq packages/labwright_vi_transpile; do
            echo "== $p =="
            ( cd "$p" && dart test -t corpus ) || exit 1
          done
          for app in apps/*/; do
            echo "== $app =="
            ( cd "$app" && flutter pub get && flutter test --tags corpus ) || exit 1
          done
