include: package:lints/recommended.yaml

formatter: 
  page_width: 120
  trailing_commas: preserve

analyzer:
  exclude:
    - apps/**
    # Lowered block diagrams, checked in as test fixtures. They are machine
    # output and are analyzed by `corpus_lowering_sweep_test.dart` at
    # `package:lints/recommended.yaml` — the set the emitter targets — over
    # every source the whole corpus lowers to. The extra style rules below are
    # for code a person writes.
    - packages/labwright_vi_transpile/test/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # correctness / clarity
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - always_declare_return_types
    - avoid_redundant_argument_values
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_await_in_return
    - prefer_interpolation_to_compose_strings
    - avoid_unused_constructor_parameters
    # const / immutability
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    # modernization / style
    - use_super_parameters
    - directives_ordering
