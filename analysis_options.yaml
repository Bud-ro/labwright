include: package:lints/recommended.yaml

analyzer:
  # The Flutter apps under apps/ are standalone packages (their own pubspec +
  # flutter SDK dep), NOT members of this dart pub workspace. The workspace's
  # plain `dart analyze` can't resolve `package:flutter/...`, so exclude them
  # here; each app is analyzed by `flutter analyze` instead.
  exclude:
    - apps/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # correctness / clarity
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - always_declare_return_types
    - avoid_redundant_argument_values
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_await_in_return
    - prefer_interpolation_to_compose_strings
    - avoid_unused_constructor_parameters
    # const / immutability
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    # modernization / style
    - use_super_parameters
    - directives_ordering
