name: labwright_vi_inspector
description: From scratch .vi/.ctl/.llb viewer
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  desktop_drop: ^0.7.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  image: ^4.8.0
  labwright_rsrc_parse:
    path: ../../packages/labwright_rsrc_parse
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/prim_icons/
    - assets/fonts/
  # Selawik (Microsoft, SIL OFL 1.1 — assets/fonts/LICENSE.txt): the
  # metric-compatible substitute for the Windows UI face LabVIEW renders
  # block-diagram text with. Regular + Bold from the v1.01 release.
  fonts:
    - family: Selawik
      fonts:
        - asset: assets/fonts/selawk.ttf
        - asset: assets/fonts/selawkb.ttf
          weight: 700
