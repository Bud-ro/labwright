name: labwright
description: >-
  Hardware end-to-end test authoring API and the `labwright` runner: executes
  plain-Dart E2E files sequentially (dart run — no dart test, hardware owns
  the process), binds requirement tracing IDs, serves a live execution viewer
  over HTTP, and emits CI-grade exit codes and JSON reports.
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.11.0

executables:
  labwright:

dependencies:
  # `labwright scan` and the report's content hashes parse real ASTs
  # (syntactic only, no resolution) so comments/strings/conditional imports
  # can't fool the reachability walk or shift a hash.
  analyzer: '>=6.0.0 <9.0.0'
  # SHA-1 for the report's test/setup/context identity hashes.
  crypto: ^3.0.0
  # The package:test assertion surface, usable as-is: matcher re-exports
  # expect/expectLater/fail/TestFailure + every matcher; test_api's
  # third-party-runner hooks host each body in a real test case.
  matcher: '>=0.12.15 <0.13.0'
  test_api: '>=0.5.0 <0.8.0'
  # The interactive viewer's "hot reload" self-connects to the VM service and
  # calls reloadSources (only when the process is started with the service on).
  vm_service: '>=14.0.0 <16.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
