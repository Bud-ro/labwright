name: labwright_fuzz
description: >-
  DUT fuzzing harness: seeded stimulus generators, failure oracles with a
  liveness watchdog, a mandatory safety envelope (unsafe stimulus is never
  applied), greedy shrinking of failing cases, and deterministic replay.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  labwright_core: ^0.0.1

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
