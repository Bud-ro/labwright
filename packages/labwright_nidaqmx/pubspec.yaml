name: labwright_nidaqmx
description: >-
  Cross-platform, pure-Dart access to NI's NI-DAQmx behind one API: in-process FFI
  (nicaiu.dll / libnidaqmx.so) on Windows/Linux, or gRPC to an NI gRPC Device Server
  for any platform (required on macOS, where NI ships no local DAQmx runtime).
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  labwright_core: ^0.0.1
  labwright_daq: ^0.0.1
  labwright_tdms: ^0.0.1
  ffi: ^2.1.0
  grpc: ^5.0.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0
  logging: ^1.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
