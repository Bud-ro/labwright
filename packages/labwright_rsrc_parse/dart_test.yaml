tags:
  corpus:
    # Tests that require the fetched VI corpus (tool/fetch_corpus.dart → the
    # gitignored <package>/corpus/vi/). They self-skip when the corpus is absent,
    # so CI stays green without it. By default they run a fast deterministic
    # sample; LABWRIGHT_FULL_CORPUS=1 runs the whole corpus (see corpus/README.md).
    #
    # The full corpus suite is memory-heavy: ~7.5k VIs, some decompressing to
    # multi-MB heaps. The OOM failure mode is the test runner spawning many suite
    # isolates that EACH iterate the whole corpus (N concurrent full passes, each
    # holding big heaps). The fix is NOT `-j 1` (far too slow over 7.5k files) — it
    # is bounded-concurrency iteration inside a SINGLE Dart VM with a memory cap
    # (a reusable worker pool that streams files, peak memory ≈ poolSize × per-VI
    # working set). See tool/corpus_run.dart (the shared corpus harness) — corpus
    # tests should drive the corpus through it rather than via parallel suites.
