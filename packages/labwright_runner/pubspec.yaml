name: labwright_runner
description: >-
  Runs a Labwright test from a CLI entrypoint and persists the result as
  record.json plus a TDMS file (group per phase, channel per measurement).
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  labwright_core: ^0.0.1
  labwright_tdms: ^0.0.1

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
