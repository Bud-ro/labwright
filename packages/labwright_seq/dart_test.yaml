tags:
  corpus:
    # Tests that require the fetched TestStand corpus (tool/fetch_seq_corpus.dart →
    # the gitignored <package>/corpus/seq/). They self-skip when it is absent, so
    # the default unit run stays green without it. The heavy binary tests run a
    # fast sample by default; LABWRIGHT_FULL_CORPUS=1 runs the whole corpus.
