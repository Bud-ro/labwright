name: labwright_vi_text
description: >-
  A VI as Dart code: every section of the file as typed records that build
  back to the same bytes, written out as source and read back from a file.
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  # The RSRC reader owns the decode; the text form is its records as constructors.
  labwright_rsrc_parse: ^0.0.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
