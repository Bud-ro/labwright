name: labwright_videcode
description: >-
  Decodes the contents of LabVIEW VI blocks toward a read-only graph/IR: inflates
  the compressed RSRC heap sections surfaced by labwright_viparse. Stage 1 of the
  block-diagram decode pipeline (decompression); heap/graph/IR layers build on it.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.0.9
  labwright_viparse: ^0.0.1

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
