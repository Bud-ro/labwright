# The workspace root only hosts resolution — the user-facing `labwright`
# package (E2E test API + runner executable) lives at packages/labwright.
name: labwright_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/labwright
  - packages/labwright_tdms
  - packages/labwright_rsrc_parse
  - packages/labwright_lv_runtime
  - packages/labwright_vi_transpile
  - packages/labwright_seq
  - example/e2e

dev_dependencies:
  lints: ^5.0.0
